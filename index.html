<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>블라인드풍경 결제 안내</title>
<meta name="description" content="블라인드풍경 시공 계약금 및 잔금 결제 안내 페이지입니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="블라인드풍경">
<meta property="og:title" content="블라인드풍경 결제 안내">
<meta property="og:description" content="시공 계약금 및 잔금 결제 안내">
<meta property="og:image" content="https://github.com/blindview24-sudo/blindviw/blob/main/og-image.png?raw=true">
<style>
:root{--navy:#10263f;--bg:#f5f1e9;--line:#ded7cb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:#202832}
.wrap{width:min(760px,100%);margin:auto;padding:22px}
.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 16px 45px rgba(16,38,63,.12);margin-bottom:18px}
.hero{width:100%;display:block;aspect-ratio:1200/630;object-fit:cover;background:#eee}
.section{padding:24px}
h1{margin:8px 0;color:var(--navy);font-size:32px}
h2{margin:0 0 14px;color:var(--navy);font-size:22px}
p{line-height:1.65}
.notice{background:#f9f6f0;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
label{display:block;font-weight:700;margin:16px 0 7px}
input,select{width:100%;padding:14px;border:1px solid #cfc8bc;border-radius:12px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount{font-size:30px;font-weight:800;color:var(--navy);text-align:right;padding:14px 0}
.paybtn{width:100%;border:0;border-radius:14px;padding:17px;background:var(--navy);color:white;font-size:18px;font-weight:800;opacity:.65}
.subbtn{display:block;text-align:center;text-decoration:none;border:1px solid var(--navy);color:var(--navy);border-radius:14px;padding:14px;margin-top:10px;font-weight:700}
.small{font-size:13px;color:#667085}
.badge{display:inline-block;background:#ede5d8;color:#6f5a3d;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700}
@media(max-width:600px){.row{grid-template-columns:1fr}.section{padding:20px}h1{font-size:28px}}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<img class="hero" src="https://github.com/blindview24-sudo/blindviw/blob/main/og-image.png?raw=true" alt="블라인드풍경 커튼 블라인드 전문 시공">
<div class="section">
<span class="badge">블라인드풍경 공식 결제 안내</span>
<h1>안심하고 결제하세요</h1>
<p>실측부터 견적, 설치, 사후관리까지 블라인드풍경이 직접 진행합니다.</p>
</div>
</section>

<section class="card section">
<h2>결제 정보</h2>
<div class="row">
<div><label for="name">고객명</label><input id="name" type="text" placeholder="성함을 입력하세요"></div>
<div><label for="phone">연락처</label><input id="phone" type="tel" placeholder="010-0000-0000"></div>
</div>

<label for="type">결제 구분</label>
<select id="type"><option>계약금</option><option>중도금</option><option>잔금</option><option>기타</option></select>

<label for="memo">현장명 또는 주소</label>
<input id="memo" type="text" placeholder="예: 역삼동 사무실 / 관악구 아파트">

<label for="amount">결제 금액</label>
<input id="amount" type="number" min="0" step="1000" placeholder="금액을 입력하세요">
<div class="amount"><span id="amountText">0</span>원</div>

<div class="notice">
<strong>결제 전 확인</strong>
<p class="small">현재 페이지는 디자인 완성본입니다. 실제 카드결제를 받으려면 토스페이먼츠, KG이니시스 등 PG사 연동과 사업자 심사가 필요합니다.</p>
</div>

<label style="font-weight:500"><input type="checkbox" style="width:auto;margin-right:8px">결제정보 및 개인정보 처리 안내를 확인했습니다.</label>
<button class="paybtn" type="button" disabled>카드결제 연결 예정</button>
<a class="subbtn" href="https://www.블라인드풍경.com" target="_blank" rel="noopener">블라인드풍경 홈페이지</a>
</section>
</main>
<script>
const amount=document.getElementById('amount');
const amountText=document.getElementById('amountText');
amount.addEventListener('input',()=>{amountText.textContent=Number(amount.value||0).toLocaleString('ko-KR')});
</script>
</body>
</html>
